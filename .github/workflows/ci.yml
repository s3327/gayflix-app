name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway Postgres for the e2e suite (the catalog, accounts, roles).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gayflix
          POSTGRES_PASSWORD: gayflix
          POSTGRES_DB: gayflix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gayflix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gayflix:gayflix@localhost:5432/gayflix
      # Only signs sessions in this CI database; not used anywhere else.
      BETTER_AUTH_SECRET: ci-only-secret-for-the-throwaway-test-database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:deploy
      # End-to-end + accessibility (axe) tests against the production build.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      # Production dependencies only: dev tooling (ESLint's file globbing)
      # can have advisories that never reach the deployed app.
      - run: npm audit --omit=dev --audit-level=high
