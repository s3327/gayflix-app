name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The fast checks and five shards of the end-to-end suite run side by side.
# "check" waits for all of them, so a branch rule or a reader can still
# look at one result.
jobs:
  fast:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Production dependencies only: dev tooling (ESLint's file globbing)
      # can have advisories that never reach the deployed app.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let every shard finish, so one failure shows all the others too.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    # Each shard gets its own throwaway Postgres (the catalog, accounts,
    # roles), and its own copy of the setup project's accounts.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gayflix
          POSTGRES_PASSWORD: gayflix
          POSTGRES_DB: gayflix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gayflix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gayflix:gayflix@localhost:5432/gayflix
      # Only signs sessions in this CI database; not used anywhere else.
      BETTER_AUTH_SECRET: ci-only-secret-for-the-throwaway-test-database
      # Imported posters' host, built into next/image's allowed hosts. The
      # e2e tests import from a stand-in TMDB (playwright.config.ts).
      IMAGE_HOSTS: image.tmdb.org
      # Crash reports on, sent to a stand-in Sentry (e2e/report-stub.mjs),
      # so the e2e tests run the site as it runs with reporting set up.
      NEXT_PUBLIC_SENTRY_DSN: http://e2e@127.0.0.1:3102/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      # Next.js keeps its compile work in .next/cache and rebuilds only what
      # changed. Pull requests restore the cache main saved last; only
      # pushes to main save one, from one shard.
      - id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/**', '*.mjs', '*.ts', 'tsconfig.json') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - if: matrix.shard == 1 && github.event_name == 'push' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      # End-to-end + accessibility (axe) tests against the production build.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/5
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  check:
    if: always()
    needs: [fast, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        run: |
          echo "fast: ${{ needs.fast.result }}, e2e: ${{ needs.e2e.result }}"
          test "${{ needs.fast.result }}" = success
          test "${{ needs.e2e.result }}" = success
